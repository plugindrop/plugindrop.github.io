name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - name: Check duplicate frontmatter keys
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import yaml from 'js-yaml';
          const dir = 'src/content/blog';
          let bad = false;
          for (const name of fs.readdirSync(dir).filter(x => x.endsWith('.md')).sort()) {
            const file = path.join(dir, name);
            const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
            if (lines[0]?.trim() !== '---') continue;
            const end = lines.findIndex((line, i) => i > 0 && line.trim() === '---');
            try {
              if (end < 0) throw new Error('frontmatter closing delimiter missing');
              yaml.load(lines.slice(1, end).join('\n'));
            } catch (error) {
              console.error(`${file}: ${error.message}`);
              bad = true;
            }
          }
          if (bad) process.exitCode = 1;
          JS
      - run: npx astro build
      - name: Quarantine content findings and notify in Actions
        run: node scripts/quarantine_content.mjs
      - run: npm run check:policy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
